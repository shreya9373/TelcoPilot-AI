apiVersion: apps/v1
kind: Deployment
metadata:
  name: telcopilot
spec:
  replicas: 1
  selector:
    matchLabels: {app: telcopilot}
  template:
    metadata:
      labels: {app: telcopilot}
    spec:
      containers:
        - name: telcopilot
          image: telcopilot:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - secretRef:
                name: telcopilot-secrets
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: telcopilot
spec:
  selector: {app: telcopilot}
  ports:
    - port: 80
      targetPort: 8501